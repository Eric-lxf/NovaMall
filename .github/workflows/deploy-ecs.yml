name: Build, Push and Deploy to ECS

on:
  push:
    branches:
      - master
  workflow_dispatch:

# 生产部署按顺序执行，避免新提交中断正在进行的部署。
concurrency:
  group: nova-mall-production-deploy
  cancel-in-progress: false

env:
  ACR_REGISTRY: crpi-skinyl3l0124ry6m.cn-beijing.personal.cr.aliyuncs.com
  ACR_NAMESPACE: nova_mall
  BACKEND_IMAGE_NAME: nova-mall-backend
  FRONTEND_IMAGE_NAME: nova-mall-frontend
  ECS_DEPLOY_PATH: /opt/nova-mall

jobs:
  build-backend:
    name: Build and Push Backend
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate ACR credentials
        env:
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          test -n "$ACR_USERNAME"
          test -n "$ACR_PASSWORD"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          provenance: false
          tags: |
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/${{ env.BACKEND_IMAGE_NAME }}:${{ github.sha }}
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/${{ env.BACKEND_IMAGE_NAME }}:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-frontend:
    name: Build and Push Frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate ACR credentials
        env:
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          test -n "$ACR_USERNAME"
          test -n "$ACR_PASSWORD"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # 保持在 GitHub Runner 中构建，避免 Docker 内 Vite 构建内存不足。
      - name: Build frontend dist
        working-directory: frontend
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          VITE_LOW_MEM_BUILD: "1"
          VITE_BUILD_COMPRESS: ""
        run: |
          npm ci --no-audit --no-fund
          npm run build:prod
          test -f dist/index.html

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile.release
          push: true
          provenance: false
          no-cache: true
          tags: |
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/${{ env.FRONTEND_IMAGE_NAME }}:${{ github.sha }}
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/${{ env.FRONTEND_IMAGE_NAME }}:latest

  deploy-ecs:
    name: Deploy to ECS
    needs:
      - build-backend
      - build-frontend
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read

    steps:
      - name: Checkout deployment files
        uses: actions/checkout@v4

      - name: Database migration notice
        run: |
          echo "::notice::本工作流不会自动执行数据库 SQL。发布含结构变更的版本前，请先按 docs/database-upgrade.md 备份并手工升级存量库。"
          echo "## 数据库升级提醒" >> "$GITHUB_STEP_SUMMARY"
          echo "生产部署不会自动执行 SQL；结构变更请先按 [docs/database-upgrade.md](${{ github.server_url }}/${{ github.repository }}/blob/${{ github.sha }}/docs/database-upgrade.md) 手工升级。" >> "$GITHUB_STEP_SUMMARY"

      - name: Ensure ECS deployment directory exists
        uses: appleboy/ssh-action@v1.2.1
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.ECS_SSH_FINGERPRINT }}
          script: |
            mkdir -p /opt/nova-mall

      # 上传运行编排与只读迁移资料；SQL 仍由维护窗口手工执行，不自动重放。
      - name: Upload deployment and migration files
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.ECS_SSH_FINGERPRINT }}
          source: "docker-compose.prod.yml,docs/database-upgrade.md,sql"
          target: ${{ env.ECS_DEPLOY_PATH }}

      - name: Pull ACR images and deploy containers
        uses: appleboy/ssh-action@v1.2.1
        env:
          ACR_REGISTRY: ${{ env.ACR_REGISTRY }}
          ACR_NAMESPACE: ${{ env.ACR_NAMESPACE }}
          BACKEND_IMAGE_NAME: ${{ env.BACKEND_IMAGE_NAME }}
          FRONTEND_IMAGE_NAME: ${{ env.FRONTEND_IMAGE_NAME }}
          IMAGE_TAG: ${{ github.sha }}

          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
          TOKEN_SECRET: ${{ secrets.TOKEN_SECRET }}

          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}

          NOVAMALL_OSS_KEY_ID: ${{ secrets.NOVAMALL_OSS_KEY_ID }}
          NOVAMALL_OSS_KEY_SECRET: ${{ secrets.NOVAMALL_OSS_KEY_SECRET }}

          MYSQL_HOST: ${{ vars.MYSQL_HOST }}
          MYSQL_PORT: ${{ vars.MYSQL_PORT }}
          MYSQL_DATABASE: ${{ vars.MYSQL_DATABASE }}

          REDIS_HOST: ${{ vars.REDIS_HOST }}
          REDIS_PORT: ${{ vars.REDIS_PORT }}

          NOVAMALL_OSS_ENABLED: ${{ vars.NOVAMALL_OSS_ENABLED }}
          NOVAMALL_OSS_BUCKET: ${{ vars.NOVAMALL_OSS_BUCKET }}
          NOVAMALL_OSS_ENDPOINT: ${{ vars.NOVAMALL_OSS_ENDPOINT }}
          NOVAMALL_OSS_DOMAIN: ${{ vars.NOVAMALL_OSS_DOMAIN }}

          BLOG_EXTERNAL_API_ENABLED: ${{ vars.BLOG_EXTERNAL_API_ENABLED }}
          BLOG_EXTERNAL_API_SCHEMA_READY: ${{ vars.BLOG_EXTERNAL_API_SCHEMA_READY }}
          BLOG_EXTERNAL_API_TRUSTED_PROXY_IP: ${{ vars.BLOG_EXTERNAL_API_TRUSTED_PROXY_IP }}

          EXAM_ENABLED: ${{ vars.EXAM_ENABLED }}
          EXAM_SCHEMA_READY: ${{ vars.EXAM_SCHEMA_READY }}
          EXAM_WORKER_ENABLED: ${{ vars.EXAM_WORKER_ENABLED }}
          EXAM_AI_ENABLED: ${{ vars.EXAM_AI_ENABLED }}
          EXAM_EXTRACT_MAX_OUTPUT_TOKENS: ${{ vars.EXAM_EXTRACT_MAX_OUTPUT_TOKENS }}
          EXAM_GENERATE_MAX_OUTPUT_TOKENS: ${{ vars.EXAM_GENERATE_MAX_OUTPUT_TOKENS }}
          EXAM_VERIFY_MAX_OUTPUT_TOKENS: ${{ vars.EXAM_VERIFY_MAX_OUTPUT_TOKENS }}
          EXAM_GENERATE_REASONING_EFFORT: ${{ vars.EXAM_GENERATE_REASONING_EFFORT }}
          EXAM_VERIFY_REASONING_EFFORT: ${{ vars.EXAM_VERIFY_REASONING_EFFORT }}

          BACKEND_PORT: ${{ vars.BACKEND_PORT }}
          FRONTEND_PORT: ${{ vars.FRONTEND_PORT }}
          RUOYI_LOG_PATH: ${{ vars.RUOYI_LOG_PATH }}
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.ECS_SSH_FINGERPRINT }}
          envs: ACR_REGISTRY,ACR_NAMESPACE,BACKEND_IMAGE_NAME,FRONTEND_IMAGE_NAME,IMAGE_TAG,ACR_USERNAME,ACR_PASSWORD,TOKEN_SECRET,MYSQL_USER,MYSQL_PASSWORD,REDIS_PASSWORD,NOVAMALL_OSS_KEY_ID,NOVAMALL_OSS_KEY_SECRET,MYSQL_HOST,MYSQL_PORT,MYSQL_DATABASE,REDIS_HOST,REDIS_PORT,NOVAMALL_OSS_ENABLED,NOVAMALL_OSS_BUCKET,NOVAMALL_OSS_ENDPOINT,NOVAMALL_OSS_DOMAIN,BLOG_EXTERNAL_API_ENABLED,BLOG_EXTERNAL_API_SCHEMA_READY,BLOG_EXTERNAL_API_TRUSTED_PROXY_IP,EXAM_ENABLED,EXAM_SCHEMA_READY,EXAM_WORKER_ENABLED,EXAM_AI_ENABLED,EXAM_EXTRACT_MAX_OUTPUT_TOKENS,EXAM_GENERATE_MAX_OUTPUT_TOKENS,EXAM_VERIFY_MAX_OUTPUT_TOKENS,EXAM_GENERATE_REASONING_EFFORT,EXAM_VERIFY_REASONING_EFFORT,BACKEND_PORT,FRONTEND_PORT,RUOYI_LOG_PATH
          script: |
            set -euo pipefail

            cd /opt/nova-mall

            test -f docker-compose.prod.yml
            if [ -z "$TOKEN_SECRET" ] || [ "${#TOKEN_SECRET}" -lt 64 ]; then
              echo "TOKEN_SECRET must contain at least 64 characters" >&2
              exit 1
            fi
            test -n "$MYSQL_USER"
            test -n "$MYSQL_PASSWORD"
            test -n "$REDIS_PASSWORD"
            test -n "$MYSQL_HOST"
            test -n "$REDIS_HOST"
            test -n "$RUOYI_LOG_PATH"
            if [ "$RUOYI_LOG_PATH" != "/opt/nova-mall/logs" ]; then
              echo "RUOYI_LOG_PATH must be /opt/nova-mall/logs" >&2
              exit 1
            fi

            # 智能命题配置校验开始：仅确认迁移完成后允许启用，不自动执行 SQL。
            EXAM_ENABLED="$(printf '%s' "${EXAM_ENABLED:-false}" | tr '[:upper:]' '[:lower:]')"
            EXAM_SCHEMA_READY="$(printf '%s' "${EXAM_SCHEMA_READY:-false}" | tr '[:upper:]' '[:lower:]')"
            EXAM_WORKER_ENABLED="$(printf '%s' "${EXAM_WORKER_ENABLED:-true}" | tr '[:upper:]' '[:lower:]')"
            EXAM_AI_ENABLED="$(printf '%s' "${EXAM_AI_ENABLED:-false}" | tr '[:upper:]' '[:lower:]')"
            for exam_flag in "$EXAM_ENABLED" "$EXAM_SCHEMA_READY" "$EXAM_WORKER_ENABLED" "$EXAM_AI_ENABLED"; do
              case "$exam_flag" in
                true|false) ;;
                *) echo "命题配置仅接受 true 或 false（不区分大小写）" >&2; exit 1 ;;
              esac
            done
            if [ "$EXAM_ENABLED" = "true" ] && [ "$EXAM_SCHEMA_READY" != "true" ]; then
              echo "请先完成四份命题 SQL 迁移，再设置 EXAM_SCHEMA_READY=true" >&2
              exit 1
            fi
            if [ "$EXAM_AI_ENABLED" = "true" ] && [ "$EXAM_ENABLED" != "true" ]; then
              echo "启用模型调用前须先启用智能命题功能" >&2
              exit 1
            fi
            EXAM_EXTRACT_MAX_OUTPUT_TOKENS="${EXAM_EXTRACT_MAX_OUTPUT_TOKENS:-8192}"
            EXAM_GENERATE_MAX_OUTPUT_TOKENS="${EXAM_GENERATE_MAX_OUTPUT_TOKENS:-16384}"
            EXAM_VERIFY_MAX_OUTPUT_TOKENS="${EXAM_VERIFY_MAX_OUTPUT_TOKENS:-16384}"
            EXAM_GENERATE_REASONING_EFFORT="${EXAM_GENERATE_REASONING_EFFORT:-low}"
            EXAM_VERIFY_REASONING_EFFORT="${EXAM_VERIFY_REASONING_EFFORT:-low}"
            for exam_output in "$EXAM_EXTRACT_MAX_OUTPUT_TOKENS" "$EXAM_GENERATE_MAX_OUTPUT_TOKENS" "$EXAM_VERIFY_MAX_OUTPUT_TOKENS"; do
              if ! [[ "$exam_output" =~ ^[1-9][0-9]{3,4}$ ]] || [ "$exam_output" -lt 1024 ] || [ "$exam_output" -gt 32768 ]; then
                echo "命题单次输出上限须为 1024–32768 的整数" >&2; exit 1
              fi
            done
            for exam_effort in "$EXAM_GENERATE_REASONING_EFFORT" "$EXAM_VERIFY_REASONING_EFFORT"; do
              case "$exam_effort" in low|high|max) ;; *) echo "命题思考强度仅接受 low、high、max" >&2; exit 1 ;; esac
            done
            # 智能命题配置校验结束。

            NOVAMALL_OSS_ENABLED="${NOVAMALL_OSS_ENABLED:-false}"
            NOVAMALL_OSS_KEY_ID="${NOVAMALL_OSS_KEY_ID:-}"
            NOVAMALL_OSS_KEY_SECRET="${NOVAMALL_OSS_KEY_SECRET:-}"
            NOVAMALL_OSS_BUCKET="${NOVAMALL_OSS_BUCKET:-}"
            NOVAMALL_OSS_ENDPOINT="${NOVAMALL_OSS_ENDPOINT:-oss-cn-beijing.aliyuncs.com}"
            NOVAMALL_OSS_DOMAIN="${NOVAMALL_OSS_DOMAIN:-}"
            BLOG_EXTERNAL_API_ENABLED="${BLOG_EXTERNAL_API_ENABLED:-false}"
            BLOG_EXTERNAL_API_SCHEMA_READY="${BLOG_EXTERNAL_API_SCHEMA_READY:-false}"
            BLOG_EXTERNAL_API_TRUSTED_PROXY_IP="${BLOG_EXTERNAL_API_TRUSTED_PROXY_IP:-}"
            case "$BLOG_EXTERNAL_API_ENABLED" in
              true|false) ;;
              *) echo "BLOG_EXTERNAL_API_ENABLED must be true or false" >&2; exit 1 ;;
            esac
            case "$BLOG_EXTERNAL_API_SCHEMA_READY" in
              true|false) ;;
              *) echo "BLOG_EXTERNAL_API_SCHEMA_READY must be true or false" >&2; exit 1 ;;
            esac
            if [ "$BLOG_EXTERNAL_API_ENABLED" = "true" ]; then
              if [ "$BLOG_EXTERNAL_API_SCHEMA_READY" != "true" ]; then
                echo "Set BLOG_EXTERNAL_API_SCHEMA_READY only after executing V2.7.0" >&2
                exit 1
              fi
              test -n "$BLOG_EXTERNAL_API_TRUSTED_PROXY_IP"
              if ! printf '%s\n' "$BLOG_EXTERNAL_API_TRUSTED_PROXY_IP" | grep -Eq '^([0-9]{1,3}\.){3}[0-9]{1,3}$'; then
                echo "BLOG_EXTERNAL_API_TRUSTED_PROXY_IP must be a single IPv4 address" >&2
                exit 1
              fi
              if ! printf '%s\n' "$BLOG_EXTERNAL_API_TRUSTED_PROXY_IP" | awk -F. 'NF == 4 { for (i = 1; i <= 4; i++) if ($i !~ /^[0-9]+$/ || $i > 255) exit 1; exit 0 } END { if (NF != 4) exit 1 }'; then
                echo "BLOG_EXTERNAL_API_TRUSTED_PROXY_IP contains an invalid IPv4 octet" >&2
                exit 1
              fi
            fi
            BLOG_EXTERNAL_API_TRUSTED_PROXY_IP="${BLOG_EXTERNAL_API_TRUSTED_PROXY_IP:-127.0.0.1}"
            if [ "$NOVAMALL_OSS_ENABLED" = "true" ] || [ "$NOVAMALL_OSS_ENABLED" = "1" ]; then
              test -n "$NOVAMALL_OSS_KEY_ID"
              test -n "$NOVAMALL_OSS_KEY_SECRET"
              test -n "$NOVAMALL_OSS_BUCKET"
            fi

            # 每次部署都从 GitHub Secrets / Variables 重建运行配置。
            umask 077
            {
              printf 'TOKEN_SECRET=%s\n' "$TOKEN_SECRET"

              printf 'MYSQL_HOST=%s\n' "$MYSQL_HOST"
              printf 'MYSQL_PORT=%s\n' "$MYSQL_PORT"
              printf 'MYSQL_DATABASE=%s\n' "$MYSQL_DATABASE"
              printf 'MYSQL_USER=%s\n' "$MYSQL_USER"
              printf 'MYSQL_PASSWORD=%s\n' "$MYSQL_PASSWORD"

              printf 'REDIS_HOST=%s\n' "$REDIS_HOST"
              printf 'REDIS_PORT=%s\n' "$REDIS_PORT"
              printf 'REDIS_PASSWORD=%s\n' "$REDIS_PASSWORD"

              printf 'NOVAMALL_OSS_ENABLED=%s\n' "$NOVAMALL_OSS_ENABLED"
              printf 'NOVAMALL_OSS_KEY_ID=%s\n' "$NOVAMALL_OSS_KEY_ID"
              printf 'NOVAMALL_OSS_KEY_SECRET=%s\n' "$NOVAMALL_OSS_KEY_SECRET"
              printf 'NOVAMALL_OSS_BUCKET=%s\n' "$NOVAMALL_OSS_BUCKET"
              printf 'NOVAMALL_OSS_ENDPOINT=%s\n' "$NOVAMALL_OSS_ENDPOINT"
              printf 'NOVAMALL_OSS_DOMAIN=%s\n' "$NOVAMALL_OSS_DOMAIN"

              printf 'BLOG_EXTERNAL_API_ENABLED=%s\n' "$BLOG_EXTERNAL_API_ENABLED"
              printf 'BLOG_EXTERNAL_API_SCHEMA_READY=%s\n' "$BLOG_EXTERNAL_API_SCHEMA_READY"
              printf 'BLOG_EXTERNAL_API_TRUSTED_PROXY_IP=%s\n' "$BLOG_EXTERNAL_API_TRUSTED_PROXY_IP"

              printf 'EXAM_ENABLED=%s\n' "$EXAM_ENABLED"
              printf 'EXAM_SCHEMA_READY=%s\n' "$EXAM_SCHEMA_READY"
              printf 'EXAM_WORKER_ENABLED=%s\n' "$EXAM_WORKER_ENABLED"
              printf 'EXAM_AI_ENABLED=%s\n' "$EXAM_AI_ENABLED"
              printf 'EXAM_EXTRACT_MAX_OUTPUT_TOKENS=%s\n' "$EXAM_EXTRACT_MAX_OUTPUT_TOKENS"
              printf 'EXAM_GENERATE_MAX_OUTPUT_TOKENS=%s\n' "$EXAM_GENERATE_MAX_OUTPUT_TOKENS"
              printf 'EXAM_VERIFY_MAX_OUTPUT_TOKENS=%s\n' "$EXAM_VERIFY_MAX_OUTPUT_TOKENS"
              printf 'EXAM_GENERATE_REASONING_EFFORT=%s\n' "$EXAM_GENERATE_REASONING_EFFORT"
              printf 'EXAM_VERIFY_REASONING_EFFORT=%s\n' "$EXAM_VERIFY_REASONING_EFFORT"

              printf 'BACKEND_PORT=%s\n' "$BACKEND_PORT"
              printf 'FRONTEND_PORT=%s\n' "$FRONTEND_PORT"
              printf 'RUOYI_LOG_PATH=%s\n' "$RUOYI_LOG_PATH"
            } > .env
            chmod 600 .env

            echo "$ACR_PASSWORD" | docker login "$ACR_REGISTRY" \
              --username "$ACR_USERNAME" \
              --password-stdin

            # 使用 commit SHA，不使用 latest，避免镜像版本错配。
            export BACKEND_IMAGE="${ACR_REGISTRY}/${ACR_NAMESPACE}/${BACKEND_IMAGE_NAME}:${IMAGE_TAG}"
            export FRONTEND_IMAGE="${ACR_REGISTRY}/${ACR_NAMESPACE}/${FRONTEND_IMAGE_NAME}:${IMAGE_TAG}"

            docker compose --env-file .env -f docker-compose.prod.yml config -q
            docker compose --env-file .env -f docker-compose.prod.yml pull backend frontend

            # 使用最终环境变量渲染镜像内模板并执行 Nginx 原生语法校验。
            docker compose --env-file .env -f docker-compose.prod.yml run \
              --rm --no-deps --entrypoint /bin/sh frontend \
              -c 'set -eu; /docker-entrypoint.d/20-envsubst-on-templates.sh; nginx -t'

            # SSH 部署用户无需宿主机 chown 权限；由 Docker root 临时容器初始化 bind mount。
            docker compose --env-file .env -f docker-compose.prod.yml run \
              --rm --no-deps --user 0:0 --entrypoint sh backend \
              -c 'set -eu; owner="$(id -u app):$(id -g app)"; chown -R "$owner" -- /home/ruoyi/logs; chmod 0750 -- /home/ruoyi/logs; actual="$(stat -c %u:%g /home/ruoyi/logs)"; [ "$actual" = "$owner" ]'

            # 私有卷只初始化顶层目录，不递归修改已有文件，不接入宿主机 Docker socket。
            if [ "$EXAM_ENABLED" = "true" ]; then
              docker compose --env-file .env -f docker-compose.prod.yml run \
                --rm --no-deps --user 0:0 --entrypoint sh backend \
                -c 'set -eu; target=/data/exam-private; [ "$EXAM_PRIVATE_ROOT" = "$target" ]; [ ! -L "$target" ]; mkdir -p -- "$target"; owner="$(id -u app):$(id -g app)"; chown "$owner" -- "$target"; chmod 0700 -- "$target"; [ "$(stat -c %u:%g "$target")" = "$owner" ]'
              docker compose --env-file .env -f docker-compose.prod.yml run \
                --rm --no-deps --entrypoint sh backend \
                -c 'set -eu; [ "$(id -u)" != 0 ]; [ -d "$EXAM_PRIVATE_ROOT" ]; [ -w "$EXAM_PRIVATE_ROOT" ]'
            fi

            docker compose --env-file .env -f docker-compose.prod.yml up -d --remove-orphans --wait --wait-timeout 180

            docker image prune -f
            docker compose --env-file .env -f docker-compose.prod.yml ps

            echo "Deployment completed"
            echo "Backend:  ${BACKEND_IMAGE}"
            echo "Frontend: ${FRONTEND_IMAGE}"

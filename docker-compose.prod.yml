# Production: pull pre-built images from ACR.
# Runtime variables are generated by GitHub Actions into /opt/nova-mall/.env.
# This file does not run database migrations; upgrade existing databases via docs/database-upgrade.md first.
services:
  backend:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE is required}
    container_name: nova-mall-web-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: druid,docker
      TOKEN_SECRET: ${TOKEN_SECRET:?TOKEN_SECRET is required}
      SWAGGER_ENABLED: "false"
      DRUID_STAT_ENABLED: "false"
      MALL_PAYMENT_MOCK_ENABLED: "false"
      BLOG_EXTERNAL_API_ENABLED: ${BLOG_EXTERNAL_API_ENABLED:-false}
      BLOG_EXTERNAL_API_SCHEMA_READY: ${BLOG_EXTERNAL_API_SCHEMA_READY:-false}

      # 命题开关来自部署流水线；真实模型调用独立控制，默认不外发资料。
      EXAM_ENABLED: ${EXAM_ENABLED:-false}
      EXAM_WORKER_ENABLED: ${EXAM_WORKER_ENABLED:-true}
      EXAM_AI_ENABLED: ${EXAM_AI_ENABLED:-false}
      EXAM_EXTRACT_MAX_OUTPUT_TOKENS: ${EXAM_EXTRACT_MAX_OUTPUT_TOKENS:-8192}
      EXAM_GENERATE_MAX_OUTPUT_TOKENS: ${EXAM_GENERATE_MAX_OUTPUT_TOKENS:-16384}
      EXAM_VERIFY_MAX_OUTPUT_TOKENS: ${EXAM_VERIFY_MAX_OUTPUT_TOKENS:-16384}
      EXAM_GENERATE_REASONING_EFFORT: ${EXAM_GENERATE_REASONING_EFFORT:-low}
      EXAM_VERIFY_REASONING_EFFORT: ${EXAM_VERIFY_REASONING_EFFORT:-low}
      # 固定使用独立命名卷，不得指向公开上传目录。
      EXAM_PRIVATE_ROOT: /data/exam-private

      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_PORT: ${MYSQL_PORT}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}

      NOVAMALL_OSS_ENABLED: ${NOVAMALL_OSS_ENABLED}
      NOVAMALL_OSS_KEY_ID: ${NOVAMALL_OSS_KEY_ID:-}
      NOVAMALL_OSS_KEY_SECRET: ${NOVAMALL_OSS_KEY_SECRET:-}
      NOVAMALL_OSS_BUCKET: ${NOVAMALL_OSS_BUCKET:-}
      NOVAMALL_OSS_ENDPOINT: ${NOVAMALL_OSS_ENDPOINT:-oss-cn-beijing.aliyuncs.com}
      NOVAMALL_OSS_DOMAIN: ${NOVAMALL_OSS_DOMAIN:-}

      RUOYI_PROFILE: /data/uploads
    volumes:
      - uploads_data:/data/uploads
      - exam_private_data:/data/exam-private
      - ${RUOYI_LOG_PATH}:/home/ruoyi/logs
    ports:
      - "127.0.0.1:${BACKEND_PORT}:8080"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://127.0.0.1:8080/actuator/health",
        ]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 120s

  frontend:
    image: ${FRONTEND_IMAGE:?FRONTEND_IMAGE is required}
    container_name: nova-mall-web-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_HOST: backend
      BLOG_EXTERNAL_API_TRUSTED_PROXY_IP: ${BLOG_EXTERNAL_API_TRUSTED_PROXY_IP:-127.0.0.1}
    ports:
      - "${FRONTEND_PORT}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  uploads_data:
  # 仅后端挂载；升级和关闭功能时保留，禁止使用 down -v 清除业务资料。
  exam_private_data:

name: Exam candidate checks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'backend/ruoyi-exam/**'
      - 'backend/ruoyi-blog/**'
      - 'backend/pom.xml'
      - 'backend/ruoyi-admin/**'
      - 'backend/Dockerfile'
      - 'frontend/src/**'
      - 'frontend/tests/**'
      - 'frontend/package*.json'
      - 'sql/exam_*.sql'
      - 'tools/exam-document-worker/**'
      - '.github/workflows/exam-checks.yml'

permissions:
  contents: read

concurrency:
  group: exam-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  document-worker-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Document worker unit tests (no Docker or live AI)
        working-directory: tools/exam-document-worker
        run: |
          pip install -r requirements.txt
          python -m unittest -v test_worker

  offline-tests-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: H2 workflow and local provider contract tests (no live AI)
        working-directory: backend
        run: mvn -B -pl ruoyi-exam -am test -DfailIfNoTests=false
      - name: Full backend package
        working-directory: backend
        run: mvn -B -DskipTests package -pl ruoyi-admin -am
      - name: Frontend state tests and production build
        working-directory: frontend
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          npm ci
          npm run test:exam
          npm run build:prod

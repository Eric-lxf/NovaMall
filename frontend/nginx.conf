# 外部 API 的第一层匿名洪泛保护；认证后的 client 级限流仍由后端执行。
limit_req_zone $binary_remote_addr zone=blog_external_token_ip:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=blog_external_api_ip:10m rate=60r/m;
limit_conn_zone $binary_remote_addr zone=blog_external_conn:10m;

# 只信任这个直接连接的 TLS 代理传入的 X-Forwarded-For；保留原始对端用于防直连校验。
set_real_ip_from ${BLOG_EXTERNAL_API_TRUSTED_PROXY_IP};
real_ip_header X-Forwarded-For;
real_ip_recursive on;

log_format blog_external_json escape=json
    '{"time":"$time_iso8601","request_id":"$request_id","remote_addr":"$remote_addr",'
    '"method":"$request_method","uri":"$uri","status":$status,'
    '"upstream_status":"$upstream_status","request_time":$request_time,'
    '"upstream_response_time":"$upstream_response_time"}';

# 仅允许公开契约中声明的方法；查询参数不参与路由判断。
map "$uri:$request_method" $blog_external_method_allowed {
    default 0;
    "/open-api/v1/blog/categories:GET" 1;
    "/open-api/v1/blog/tags:GET" 1;
    "/open-api/v1/blog/articles:GET" 1;
    "/open-api/v1/blog/articles:POST" 1;
    ~^/open-api/v1/blog/articles/[0-9]+:GET$ 1;
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # 账单 AI 识别会把本地图以 Base64 放进 JSON，体积约为原图 4/3；
    # Nginx 默认 client_max_body_size=1m，超出会直接 413
    client_max_body_size 20m;

    # 基础浏览器安全头；不设置可能破坏现有富文本/第三方资源的强 CSP。
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Request-ID $request_id always;

    limit_req_status 429;
    limit_conn_status 429;
    error_page 429 = @blog_external_rate_limited;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Docker 内置 DNS：延迟解析 upstream，避免 backend 未就绪时 Nginx 启动失败
    resolver 127.0.0.11 valid=30s ipv6=off;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location @blog_external_rate_limited {
        access_log /dev/stdout blog_external_json;
        add_header Retry-After "60" always;
        add_header X-Request-ID $request_id always;
        return 429;
    }

    # OAuth client_credentials 换取短期访问令牌。客户端提交的 X-Request-ID 会被覆盖，
    # 避免日志注入并保证网关、应用与审计表使用同一个请求 ID。
    location = /open-api/v1/oauth/token {
        if ($realip_remote_addr != ${BLOG_EXTERNAL_API_TRUSTED_PROXY_IP}) { return 403; }
        if ($request_method != POST) { return 405; }

        client_max_body_size 1m;
        access_log /dev/stdout blog_external_json;
        limit_req zone=blog_external_token_ip burst=5 nodelay;
        limit_conn blog_external_conn 5;

        set $backend_host ${BACKEND_HOST};
        proxy_pass http://$backend_host:8080;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Request-ID $request_id;
        proxy_hide_header X-Request-ID;
    }

    # 公开博客契约：分类只读；文章列表只读/创建；文章详情只读。
    location ~ ^/open-api/v1/blog/(?:categories|tags|articles(?:/[0-9]+)?)$ {
        if ($realip_remote_addr != ${BLOG_EXTERNAL_API_TRUSTED_PROXY_IP}) { return 403; }
        if ($blog_external_method_allowed = 0) { return 405; }

        client_max_body_size 1m;
        access_log /dev/stdout blog_external_json;
        limit_req zone=blog_external_api_ip burst=20 nodelay;
        limit_conn blog_external_conn 5;

        set $backend_host ${BACKEND_HOST};
        proxy_pass http://$backend_host:8080;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Request-ID $request_id;
        proxy_hide_header X-Request-ID;
    }

    # 未声明的 open-api 路径不回落到 SPA，也不进入通用 /prod-api 代理。
    location /open-api/ {
        if ($realip_remote_addr != ${BLOG_EXTERNAL_API_TRUSTED_PROXY_IP}) { return 403; }
        access_log /dev/stdout blog_external_json;
        return 404;
    }

    # 禁止通过后台通用前缀绕过外部 API 的专用限流、体积和方法约束。
    location ^~ /prod-api/open-api/ {
        access_log /dev/stdout blog_external_json;
        return 404;
    }

    # 生产前端实际请求带 /prod-api 前缀；必须在通用 API location 前关闭 SSE 缓冲。
    location ^~ /prod-api/blog/ai/stream/ {
        set $backend_host ${BACKEND_HOST};
        rewrite ^/prod-api/?(.*)$ /$1 break;
        proxy_pass http://$backend_host:8080;
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
    }

    location /prod-api/ {
        set $backend_host ${BACKEND_HOST};
        rewrite ^/prod-api/?(.*)$ /$1 break;
        # 使用变量时 proxy_pass 不能带路径后缀，否则 Nginx 会返回 500
        proxy_pass http://$backend_host:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 账单识别（图片/PDF OCR）常超过 Nginx 默认 60s，否则前端表现为「系统接口504异常」
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # 兼容不带 API 前缀的反向代理部署。
    location /blog/ai/stream/ {
        set $backend_host ${BACKEND_HOST};
        proxy_pass http://$backend_host:8080;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
    }

    location /uploads/ {
        set $backend_host ${BACKEND_HOST};
        proxy_pass http://$backend_host:8080;
    }
}

# 项目相关配置
ruoyi:
  # 名称
  name: NovaMall
  # 版本
  version: 3.9.2
  # 版权年份
  copyrightYear: 2026
  # 文件路径 示例（ Windows配置D:/ruoyi/uploadPath，Linux配置 /home/ruoyi/uploadPath）
  profile: D:/ruoyi/uploadPath
  # 获取ip地址开关
  addressEnabled: false
  # 验证码类型 math 数字计算 char 字符验证
  captchaType: math

# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8080
  port: 8080
  servlet:
    # 应用的访问路径
    context-path: /
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # 连接数满后的排队数，默认为100
    accept-count: 1000
    # JSON Base64 识别请求体（非 multipart）也受此限制；默认约 2MB 易触发 413
    max-http-form-post-size: 20MB
    max-swallow-size: 20MB
    threads:
      # tomcat最大线程数，默认为200
      max: 800
      # Tomcat启动初始化的线程数，默认值10
      min-spare: 100

# 日志配置
logging:
  level:
    com.ruoyi: debug
    org.springframework: warn

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10

# Spring配置
spring:
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    active: druid
  autoconfigure:
    exclude:
      - com.baomidou.mybatisplus.autoconfigure.MybatisPlusAutoConfiguration
  # 统一 JSON 日期序列化为东八区
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小（账单识别支持 PDF/Excel，略大于截图）
      max-file-size: 15MB
      # 设置总上传的文件大小
      max-request-size: 20MB
  # 服务模块
  devtools:
    restart:
      # 热部署开关
      enabled: true
  data:
    # redis 配置
    redis:
      # 地址
      host: localhost
      # 端口，默认为6379
      port: 6379
      # 数据库索引
      database: 0
      # 密码
      password:
      # 连接超时时间
      timeout: 10s
      lettuce:
        pool:
          # 连接池中的最小空闲连接
          min-idle: 0
          # 连接池中的最大空闲连接
          max-idle: 8
          # 连接池的最大数据库连接数
          max-active: 8
          # #连接池最大阻塞等待时间（使用负值表示没有限制）
          max-wait: -1ms

# token配置
token:
  # 令牌自定义标识
  header: Authorization
  # 令牌密钥
  # 所有环境均必须外部注入，避免源码中的固定密钥被用于伪造令牌。
  secret: ${TOKEN_SECRET}
  # 令牌有效期（默认30分钟）
  expireTime: 30

# MyBatis配置
mybatis:
  # 搜索指定包别名
  typeAliasesPackage: com.ruoyi.**.domain
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 加载全局的配置文件
  configLocation: classpath:mybatis/mybatis-config.xml

# PageHelper分页插件
pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

# Springdoc配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
  group-configs:
    - group: 'default'
      display-name: '测试模块'
      paths-to-match: '/**'
      packages-to-scan: com.ruoyi.web.controller.tool,com.ruoyi.blog.controller,com.ruoyi.wechat.controller,com.ruoyi.mall.product.controller,com.ruoyi.mall.trade.controller,com.ruoyi.mall.payment.controller

# 防盗链配置
referer:
  # 防盗链开关
  enabled: false
  # 允许的域名列表
  allowed-domains: localhost,127.0.0.1

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice,/blog/**
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*

# 博客上传与静态资源 URL
blog:
  file:
    upload-dir: ./uploads
    url-prefix: /uploads
  # 外部博客写入 API：默认关闭，仅在完成数据库升级和客户端配置后显式开启。
  external-api:
    enabled: false
    schema-ready: false
    token-ttl-seconds: 900
    idempotency-ttl-hours: 72
    audit-retention-days: 90
    max-body-bytes: 1048576
    default-rate-limit-per-minute: 60
  notification:
    from: ${MAIL_FROM:noreply@localhost}
    email:
      retryDelayMs: 300000

# NovaMall 对象存储（阿里云 OSS）
novamall:
  oss:
    enabled: ${NOVAMALL_OSS_ENABLED:false}
    endpoint: ${NOVAMALL_OSS_ENDPOINT:oss-cn-beijing.aliyuncs.com}
    access-key-id: ${NOVAMALL_OSS_KEY_ID:}
    access-key-secret: ${NOVAMALL_OSS_KEY_SECRET:}
    bucket-name: ${NOVAMALL_OSS_BUCKET:}
    custom-domain: ${NOVAMALL_OSS_DOMAIN:}
    object-prefix: uploads/

# MyBatis-Plus 约定（博客表逻辑删除等）
mybatis-plus:
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

wechat:
  enabled: false
  connect-timeout-ms: 10000
  read-timeout-ms: 30000
